<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 폴란드 방산 산업시찰단</title><style>html,body,#app{margin:0;width:100%;height:100%;min-height:100vh;background:#f5f7fa}iframe{border:0;width:100%;height:100vh;display:block}.loading{font-family:system-ui,sans-serif;padding:24px;color:#002060}</style></head><body><div id="app"><div class="loading">출장 가이드를 불러오는 중...</div></div><script>(async()=>{try{const files=['payload_01.txt','payload_02.txt','payload_03.txt','payload_04.txt','payload_05.txt','payload_06.txt'];const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const fr=document.createElement('iframe');fr.title='2026 폴란드 방산 산업시찰단';fr.srcdoc=html;document.getElementById('app').replaceChildren(fr)}catch(e){document.getElementById('app').innerHTML='<div class="loading">페이지를 불러오지 못했습니다. 잠시 후 다시 열어주세요.</div>'}})();</script></body></html>
